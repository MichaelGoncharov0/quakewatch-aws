name: QuakeWatch CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint on app Python files
        shell: bash
        run: |
          mapfile -d '' PY_FILES < <(find "$GITHUB_WORKSPACE/QuakeWatch-app" -type f -name "*.py" \
            ! -path "*/.git/*" \
            ! -path "*/venv/*" \
            -print0 || true)

          if [ ${#PY_FILES[@]} -eq 0 ]; then
            echo "No Python files found in QuakeWatch-app"
            exit 1
          fi

          python -m pylint --disable=import-error "${PY_FILES[@]}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint quakewatch-chart --strict
          helm template quakewatch quakewatch-chart --namespace quakewatch > /dev/null
          helm template quakewatch quakewatch-chart --namespace quakewatch -f quakewatch-chart/values-aws.yaml > /dev/null

      - name: Build Docker image
        run: |
          docker build -f QuakeWatch-app/Dockerfile -t quakewatch:ci QuakeWatch-app
