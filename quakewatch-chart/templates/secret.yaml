apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quakewatch-chart.labels" . | nindent 4 }}
type: Opaque
data:
  # secretValues are plain text in values.yaml; encode exactly once here
  {{- range $key, $value := .Values.secretValues }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
